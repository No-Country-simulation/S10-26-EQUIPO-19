[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

base_url = https://openbridge-dev.vercel.app

markers =
    smoke: pruebas rápidas de disponibilidad de funciones principales
    e2e: pruebas end-to-end de flujos funcionales completos
addopts =
    -v
    --tb=short
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --html=reports/report.html
    --self-contained-html
